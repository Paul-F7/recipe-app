<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact – FlavorFlick</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 20% 10%, #ffe3c9 0%, transparent 45%),
                radial-gradient(circle at 80% 90%, #ffd1d1 0%, transparent 45%),
                #fff8f2;
    color: #1f1f1f;
    line-height: 1.6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }
  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
    max-width: 520px;
    width: 100%;
    padding: 2.5rem 2rem;
    text-align: center;
  }
  h1 {
    font-size: 2rem;
    margin: 0 0 0.5rem;
    letter-spacing: -0.02em;
  }
  .tagline {
    color: #666;
    margin: 0 0 2rem;
    font-size: 1rem;
  }
  p {
    margin: 0 0 1rem;
    color: #333;
  }
  .email-button {
    display: inline-block;
    margin-top: 1.25rem;
    padding: 0.9rem 1.75rem;
    background: linear-gradient(135deg, #ff7a59 0%, #ff5151 100%);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.05rem;
    border-radius: 999px;
    box-shadow: 0 10px 25px rgba(255, 90, 80, 0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .email-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(255, 90, 80, 0.4);
  }
  .note {
    margin-top: 2rem;
    font-size: 0.9rem;
    color: #888;
  }
  .back-link {
    display: inline-block;
    margin-top: 1.5rem;
    color: #ff5151;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
  }
  .back-link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main class="card">
    <h1>Get in Touch</h1>
    <p class="tagline">We'd love to hear from you.</p>

    <p>
      Whether you've run into a bug, have a feature request,
      want to report a concern, or just want to say hi —
      we read every message and will get back to you as soon as we can.
    </p>

    <a class="email-button" href="mailto:paul.fomitchev@gmail.com?subject=FlavorFlick%20Support">
      Email Support
    </a>

    <p class="note">paul.fomitchev@gmail.com</p>

    <a class="back-link" href="/">← Back to FlavorFlick</a>
  </main>
</body>
</html>
