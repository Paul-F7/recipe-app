<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact – FlavorFlick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #040404;
    --bg-deep: #020202;
    --text: #f7f2ea;
    --muted: rgba(247, 242, 234, 0.68);
    --accent: #f6c457;
    --accent-strong: #f59e0b;
    --accent-cool: #4ade80;
    --border-soft: rgba(247, 242, 234, 0.12);
  }

  html, body { height: 100%; }

  body {
    font-family: "DM Sans", "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at top left, rgba(16, 255, 128, 0.04), transparent 50%),
      radial-gradient(circle at 20% 80%, rgba(74, 222, 128, 0.06), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    color: var(--text);
    letter-spacing: -0.01em;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }

  /* Animated gradient orbs (matching site) */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }
  .orb-1 {
    width: 55vw; height: 55vw;
    max-width: 640px; max-height: 640px;
    background: radial-gradient(circle, rgba(34, 255, 128, 0.22) 0%, transparent 70%);
    top: -25%; right: -10%;
    animation: float1 18s ease-in-out infinite;
  }
  .orb-2 {
    width: 45vw; height: 45vw;
    max-width: 520px; max-height: 520px;
    background: radial-gradient(circle, rgba(246, 196, 87, 0.12) 0%, transparent 70%);
    bottom: -20%; left: -10%;
    animation: float2 22s ease-in-out infinite;
  }
  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(-30px, 20px) scale(1.05); }
    66% { transform: translate(20px, -30px) scale(0.95); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -20px) scale(1.08); }
  }

  .noise {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='180' height='180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='180' height='180' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
    opacity: 0.2;
    mix-blend-mode: soft-light;
  }

  .card {
    position: relative;
    z-index: 1;
    max-width: 480px;
    width: 100%;
    text-align: center;
    padding: 3rem 2rem;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-soft);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
  }

  .eyebrow {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.25rem;
    padding: 0.4rem 0.9rem;
    border: 1px solid rgba(246, 196, 87, 0.25);
    border-radius: 999px;
    background: rgba(246, 196, 87, 0.06);
  }

  h1 {
    font-size: clamp(2rem, 5vw, 2.75rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 1rem;
    background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    color: var(--muted);
    font-size: 1.05rem;
    margin-bottom: 2.25rem;
    line-height: 1.5;
  }

  .email-button {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 1rem 1.75rem;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
    color: #1a1200;
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: -0.01em;
    border-radius: 999px;
    box-shadow: 0 15px 40px rgba(246, 196, 87, 0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .email-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 20px 50px rgba(246, 196, 87, 0.35);
  }
  .email-button svg {
    width: 18px; height: 18px;
  }

  .email-display {
    margin-top: 1.5rem;
    font-size: 0.92rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .email-display a {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px dashed var(--border-soft);
    padding-bottom: 1px;
  }
  .email-display a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .back-link {
    display: inline-block;
    margin-top: 2.5rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.88rem;
    transition: color 0.2s ease;
  }
  .back-link:hover {
    color: var(--accent-cool);
  }
</style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="noise"></div>

  <main class="card">
    <span class="eyebrow">Contact</span>
    <h1>Email me</h1>
    <p class="subtitle">
      Questions, feedback, or support — drop me a note and I'll get back to you.
    </p>

    <a class="email-button" href="mailto:paul.fomitchev@gmail.com?subject=FlavorFlick">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <path d="m3 7 9 6 9-6"/>
      </svg>
      Send an email
    </a>

    <p class="email-display">
      <a href="mailto:paul.fomitchev@gmail.com">paul.fomitchev@gmail.com</a>
    </p>

    <a class="back-link" href="/">← Back to FlavorFlick</a>
  </main>
</body>
</html>
